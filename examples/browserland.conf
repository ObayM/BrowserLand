# Hello, This is an example config for BrowserLand :)
#   Try it using:
#               browserland --config-dir examples
#
# Note: that you can edit that file while the browser is open and it would refresh automatically!
#

# Try other colors here and this is how to declare a variable here!
$accent = #f38ba8


general {
    homepage = https://obayy.dev # You can change this to customize your homepage
}


appearance {
    accent = $accent
    background = #161633
    tabs = vertical
}

# This the clock settings, if you created a widget, it can read this as Config.clock.format

clock {
    format = hh:mm
}

# These replace the built-in binds that use the same keys.
bind = CTRL SHIFT, W, close-tab
bind = ALT, 1, open, https://hackclub.com # or any website!

# This is how you add a widget :)
widget = clock, widgets/Clock.qml, toolbar-right
