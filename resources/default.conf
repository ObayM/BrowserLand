# BrowserLand config
#
#
# How it works ():
#   key = value                a setting
#   section { ... }            a group of settings
#   $name = value              a variable, used later as $name
#   bind = MODS, KEY, action   a keyboard shortcut
#   widget = name, file, slot  put your own QML widget somewhere in the UI
#   siterule = rule, site      change how a site behaves (zoom 1.25, css file.css, js file.js)
#   source = other.conf        read another file
#   # comment                  at the start of a line, or with a space after it

general {
    homepage = https://duckduckgo.com
    # leave empty for the built-in new tab page, or put a site here
    new_tab =
    # {} is replaced by what you type in the address bar
    search_url = https://duckduckgo.com/?q={}
    # reopen your tabs from last time
    restore_session = true
    # leave empty for your Downloads folder
    download_dir =
}

# type "g cats" in the address bar to search with g
search {
    g = https://www.google.com/search?q={}
    w = https://en.wikipedia.org/w/index.php?search={}
    yt = https://www.youtube.com/results?search_query={}
}

# what to do when a site asks for something: ask, allow or deny
# you can set camera, microphone, screen, location, notifications, clipboard, mouse_lock and fonts
permissions {
    default = ask
}

appearance {
    accent = #89b4fa
    background = #1e1e2e
    foreground = #cdd6f4
    font_size = 13
    # leave empty for your system font
    font =
    # how round corners are, 0 for square
    radius = 8
    animations = true

    # a picture, or a folder to pick a random one from, for the new tab page
    wallpaper = ~/Pictures/wallpapers
}

bind = CTRL, T, new-tab
bind = CTRL, W, close-tab
bind = CTRL SHIFT, T, reopen-closed-tab
bind = CTRL, TAB, next-tab
bind = CTRL SHIFT, TAB, prev-tab
bind = CTRL, L, focus-url
bind = CTRL, F, find
bind = CTRL, R, reload
bind = ALT, LEFT, back
bind = ALT, RIGHT, forward
bind = CTRL, PLUS, zoom-in
bind = CTRL, MINUS, zoom-out
bind = CTRL, 0, zoom-reset
bind = , F12, devtools
bind = CTRL SHIFT, R, reload-config
bind = CTRL, 1, select-tab, 1
bind = CTRL, 2, select-tab, 2
bind = CTRL, 3, select-tab, 3
bind = CTRL, 4, select-tab, 4
bind = CTRL, 5, select-tab, 5
bind = CTRL, 6, select-tab, 6
bind = CTRL, 7, select-tab, 7
bind = CTRL, 8, select-tab, 8
bind = CTRL, 9, select-tab, 9
