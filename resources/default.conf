# BrowserLand config
#
#
# How it works ():
#   key = value                a setting
#   section { ... }            a group of settings
#   $name = value              a variable, used later as $name
#   bind = MODS, KEY, action   a keyboard shortcut
#   widget = name, file, slot  put your own QML widget somewhere in the UI
#   source = other.conf        read another file
#   # comment                  at the start of a line, or with a space after it

general {
    homepage = https://duckduckgo.com
    # {} is replaced by what you type in the address bar
    search_url = https://duckduckgo.com/?q={}
}

appearance {
    accent = #89b4fa
    background = #1e1e2e
    foreground = #cdd6f4
    font_size = 13
}

bind = CTRL, T, new-tab
bind = CTRL, W, close-tab
bind = CTRL, TAB, next-tab
bind = CTRL SHIFT, TAB, prev-tab
bind = CTRL, L, focus-url
bind = CTRL, R, reload
bind = ALT, LEFT, back
bind = ALT, RIGHT, forward
bind = CTRL, PLUS, zoom-in
bind = CTRL, MINUS, zoom-out
bind = , F12, devtools
bind = CTRL SHIFT, R, reload-config
